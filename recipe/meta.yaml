{% set name = "serializable" %}
{% set version = "1.3.1" %}
{% set sha256 = "d82c0b6b0bf64c1287f2a31ffd15629e85601dc691f961d5f9c9794a7b13dd60" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - pypandoc
  run:
    - python >={{ python_min }}
    - typechecks >=0.0.2
    - six >=1.9.0
    - simplejson

test:
  requires:
    - python {{ python_min }}
  imports:
    - serializable

about:
  home: https://github.com/iskandr/serializable
  license: Apache-2.0
  summary: 'Base class with serialization helpers for user-defined Python objects'
  license_family: Apache
  license_file: '{{ environ["RECIPE_DIR"] }}/LICENSE'

extra:
  recipe-maintainers:
    - npavlovikj
    - ccwang002
